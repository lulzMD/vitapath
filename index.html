function dashboard(){const w=latest('weights'),start=[...data.weights].sort((a,b)=>a.date.localeCompare(b.date))[0];const meals=data.meals.filter(x=>x.date===today()),steps=data.steps.find(x=>x.date===today()),water=data.water.find(x=>x.date===today());return `<h2>Today's overview</h2><div class="grid">${card('Weight',w?fmt(w.value)+' kg':'—',start&&w?`${fmt(num(start.value)-num(w.value))} kg change`:'Log first weight')}${card('Mounjaro',shot(),recentInj()?`${esc(recentInj().dose)} • last ${recentInj().date}`:'No injections logged')}${card('Calories',fmt(sum(meals,'calories'))+' kcal',`${fmt(data.settings.calories)} kcal daily goal`)}${card('Steps',fmt(steps?.value||0),`${fmt(data.settings.steps)} daily goal`)}</div><div class="actions"><button class="btn" onclick="openForm('weight')">+ Weight</button><button class="btn secondary" onclick="openForm('injections')">+ Injection</button><button class="btn secondary" onclick="openForm('food')">+ Meal</button><button class="btn secondary" onclick="openForm('steps')">+ Steps</button></div><div class="two"><section class="card"><h3>Weight trend</h3>${graph(data.weights,'value','kg',30)}<div class="actions"><button class="btn secondary" onclick="go('weight')">Full chart →</button></div></section><section class="card"><h3>Today's targets</h3><div class="small">Calories ${fmt(sum(meals,'calories'))} / ${fmt(data.settings.calories)}</div>${bar(sum(meals,'calories'),data.settings.calories)}<p class="small">Protein ${fmt(sum(meals,'protein'))} / ${fmt(data.settings.protein)} g</p>${bar(sum(meals,'protein'),data.settings.protein)}<p class="small">Steps ${fmt(steps?.value||0)} / ${fmt(data.settings.steps)}</p>${bar(steps?.value||0,data.settings.steps)}<p class="small">Water ${fmt(water?.value||0)} / ${fmt(data.settings.water)} mL</p>${bar(water?.value||0,data.settings.water)}<div class="actions"><button class="btn secondary" onclick="openForm('water')">+ Water</button></div></section></div><div class="card" style="margin-top:12px"><h3>Quick insight</h3>${weeklySummary()}</div>`}
function ranges(){return `<div class="split">${[['7','7D'],['30','30D'],['90','90D'],['all','All']].map(([v,l])=>`<button class="btn ${range===v?'':'secondary'}" onclick="range='${v}';render()">${l}</button>`).join('')}</div>`}
function graph(entries,key,unit,days){let arr=[...entries].filter(x=>/^\d{4}-\d{2}-\d{2}$/.test(x.date||'')&&x[key]!==null&&x[key]!==''&&Number.isFinite(Number(x[key]))).sort((a,b)=>a.date.localeCompare(b.date));if(days)arr=arr.filter(x=>dayDiff(x.date,today())>=0&&dayDiff(x.date,today())<days);else arr=filterRange(arr);if(arr.length<2)return empty('Add at least two dated measurements to see a trend.');const minD=arr[0].date,maxD=arr[arr.length-1].date,span=Math.max(1,dayDiff(minD,maxD)),vals=arr.map(x=>Number(x[key])),low=Math.min(...vals),high=Math.max(...vals),spread=high-low,pad=Math.max(spread*.15,Math.abs(high)*.02,0.5),ymin=low-pad,ymax=high+pad,safeSpan=Math.max(ymax-ymin,1e-9);const x=d=>48+Math.max(0,Math.min(1,dayDiff(minD,d)/span))*620,y=v=>Math.max(45,Math.min(220,220-(v-ymin)/safeSpan*175));const points=arr.map(v=>`${x(v.date).toFixed(1)},${y(Number(v[key])).toFixed(1)}`).join(' ');return `<svg class="chart" viewBox="0 0 700 265" role="img" aria-label="${esc(unit)} trend from ${minD} to ${maxD}"><line x1="48" y1="45" x2="668" y2="45"/><line x1="48" y1="132" x2="668" y2="132"/><line x1="48" y1="220" x2="668" y2="220"/><text x="3" y="48">${fmt(ymax)}</text><text x="3" y="135">${fmt((ymax+ymin)/2)}</text><text x="3" y="223">${fmt(ymin)}</text><polyline fill="none" stroke="#46dab2" stroke-width="3" points="${points}"/>${arr.map(v=>`<circle cx="${x(v.date)}" cy="${y(Number(v[key]))}" r="4" fill="#65c6f3"><title>${esc(v.date)}: ${fmt(v[key])} ${esc(unit)}</title></circle>`).join('')}<text x="48" y="251">${minD}</text><text x="668" y="251" text-anchor="end">${maxD}</text></svg>`}
function recordList(kind,renderer){const arr=ordered(kind);return arr.length?`<div class="list">${arr.map(x=>`<div class="item"><div class="row"><div>${renderer(x)}<div class="small">${esc(x.date)}</div></div><div class="split"><button class="btn secondary" onclick="openForm('${kind}','${x.id}')">Edit</button><button class="btn danger" onclick="remove('${kind}','${x.id}')">Delete</button></div></div></div>`).join('')}</div>`:empty('No records yet. Add your first entry.')}
function remove(kind,id){if(!confirm('Delete this record?'))return;data[kind]=data[kind].filter(x=>x.id!==id);commit()}

function weight(){const w=latest('weights'),start=[...data.weights].sort((a,b)=>a.date.localeCompare(b.date))[0],loss=start&&w?num(start.value)-num(w.value):null,percent=loss!==null&&num(start.value)>0?100*loss/num(start.value):null,waist=latest('waist');return `<div class="row"><h2>Weight & body</h2><button class="btn" onclick="openForm('weight')">+ Weight</button></div><div class="grid">${card('Latest',w?fmt(w.value)+' kg':'—',w?.date||'')}${card('Total change',loss===null?'—':fmt(-loss)+' kg',percent===null?'':`${fmt(percent)}% loss from baseline`)}${card('Goal',fmt(data.settings.target)+' kg','Editable in Settings')}${card('BMI',w&&num(data.settings.height)>0?fmt(num(w.value)/Math.pow(num(data.settings.height)/100,2)):'—','Enter height in Settings')}</div><section class="card" style="margin-top:12px"><div class="row"><h3>Weight trend</h3>${ranges()}</div>${graph(data.weights,'value','kg')}</section><div class="two" style="margin-top:12px"><section class="card"><h3>Weight records</h3>${recordList('weights',x=>`<b>${fmt(x.value)} kg</b><p class="small">${esc(x.note||'')}</p>`)}</section><section class="card"><div class="row"><h3>Waist circumference</h3><button class="btn secondary" onclick="openForm('waist')">+ Waist</button></div>${graph(data.waist,'value','cm')}${recordList('waist',x=>`<b>${fmt(x.value)} cm</b>`)}</section></div>`}
function food(){const t=data.meals.filter(x=>x.date===today());return `<div class="row"><h2>Nutrition</h2><button class="btn" onclick="openForm('food')">+ Meal</button></div><div class="grid">${card('Calories',fmt(sum(t,'calories'))+' kcal',`${fmt(data.settings.calories)} goal`)}${card('Protein',fmt(sum(t,'protein'))+' g',`${fmt(data.settings.protein)} goal`)}${card('Carbs',fmt(sum(t,'carbs'))+' g','Today')}${card('Fat',fmt(sum(t,'fat'))+' g','Today')}</div><section class="card" style="margin-top:12px"><h3>Quick add Malaysian foods</h3><div class="small">Illustrative estimates. Tap a food, choose number of servings, then review or edit before saving.</div><div class="actions">${[['Nasi lemak (basic)',400,9,55,17],['Roti canai (plain)',300,7,42,11],['Chicken rice',600,28,75,19],['Nasi kerabu',500,22,65,16],['Boiled egg',75,6,1,5]].map((x,i)=>`<button class="btn secondary" onclick="quickFood(${i})">+ ${x[0]}</button>`).join('')}</div></section><div class="two" style="margin-top:12px"><section class="card"><h3>Daily calories trend</h3>${dailyGraph('meals','calories','kcal')}</section><section class="card"><h3>Daily protein trend</h3>${dailyGraph('meals','protein','g')}</section></div><section class="card" style="margin-top:12px"><h3>Meal history</h3>${recordList('meals',x=>`<b>${esc(x.name)}</b> • ${fmt(x.calories)} kcal<p class="small">P ${fmt(x.protein)}g · C ${fmt(x.carbs)}g · F ${fmt(x.fat)}g</p>`)}</section><div class="notice" style="margin-top:12px">Photo-based AI estimation is not included in this offline, single-file version. No fake AI analysis or hidden API key is used.</div>`}

function labs(){const opts=labDefs.map(x=>`<option value="${x[0]}" ${labMetric===x[0]?'selected':''}>${x[1]}</option>`).join('');const rows=labDefs.map(([key,name,unit])=>{const records=ordered('labs').filter(x=>x.key===key),base=records.find(x=>x.baseline)||[...records].reverse()[0],recent=records[0];if(!records.length)return '';const delta=base&&recent?num(recent.value)-num(base.value):null;return `<tr><td>${esc(name)}</td><td>${base?fmt(base.value):'—'}</td><td>${recent?fmt(recent.value):'—'}</td><td>${delta===null?'—':(delta>0?'+':'')+fmt(delta)}</td><td>${esc(unit)}</td></tr>`}).join('');return `<div class="row"><h2>Blood results</h2><button class="btn" onclick="openForm('labs')">+ Lab result</button></div><div class="notice">Enter actual laboratory values and units. Reference ranges vary by laboratory and clinical context; VitaPath does not diagnose abnormalities. Tests such as amylase and lipase are not recommended as routine screening without a clinical indication.</div><section class="card" style="margin-top:12px"><h3>Baseline vs latest</h3><div class="scroll"><table><thead><tr><th>Parameter</th><th>Baseline/first</th><th>Latest</th><th>Change</th><th>Unit</th></tr></thead><tbody>${rows||'<tr><td colspan="5">No blood results entered</td></tr>'}</tbody></table></div><p class="hint">Baseline is the earliest value unless a record is explicitly marked as baseline. A change is not automatically an improvement or deterioration.</p></section><section class="card" style="margin-top:12px"><div class="row"><h3>Blood result trend</h3><select aria-label="Blood parameter" style="max-width:190px" onchange="labMetric=this.value;render()">${opts}</select></div>${graph(data.labs.filter(x=>x.key===labMetric),'value',labDefs.find(x=>x[0]===labMetric)?.[2]||'',null)}</section><section class="card" style="margin-top:12px"><h3>All laboratory records</h3>${recordList('labs',x=>`<b>${esc(labDefs.find(y=>y[0]===x.key)?.[1]||x.key)}: ${fmt(x.value)} ${esc(labDefs.find(y=>y[0]===x.ke function weeklySummary(){const w=ordered('weights'),recent=w.find(x=>dayDiff(x.date,today())<7&&dayDiff(x.date,today())>=0),prior=w.find(x=>dayDiff(x.date,today())>=7);const diff=recent&&prior?num(recent.value)-num(prior.value):null;const food=within(data.meals,7),st=within(data.steps,7);return `<p>${diff===null?'Add weights spanning at least two weeks to calculate a weekly change.':`Weight change compared with the previous available measurement: <b>${diff>0?'+':''}${fmt(diff)} kg</b>.`}</p><p>Recorded calorie intake in the last 7 days: <b>${fmt(sum(food,'calories'))} kcal total</b> (${fmt(Math.round(sum(food,'calories')/7))}/day across all 7 days).</p><p>Recorded steps: <b>${fmt(sum(st,'value'))}</b> in 7 days (${fmt(Math.round(sum(st,'value')/7))}/day across all 7 days).</p><p class="hint">Missing days are not assumed to be accurate zeros. Comparisons reflect logged data only.</p>`}

function settings(){const s=data.settings;return `<h2>Settings & data</h2><section class="card"><h3>Personal goals</h3><form onsubmit="saveSettings(event)"><div class="fields">${[['target','Target weight (kg)'],['height','Height (cm)'],['calories','Daily calories (kcal)'],['protein','Daily protein (g)'],['steps','Daily steps'],['water','Daily water (mL)'],['interval','Injection interval (days)']].map(([k,l])=>`<div class="field"><label for="s_${k}">${l}</label><input id="s_${k}" name="${k}" type="number" min="${k==='height'?0:1}" max="${k==='interval'?30:100000}" step="${k==='target'||k==='height'?'0.1':'1'}" value="${esc(s[k])}" required></div>`).join('')}<div class="field"><label>Theme</label><select name="theme"><option value="dark" ${s.theme==='dark'?'selected':''}>Dark</option><option value="light" ${s.theme==='light'?'selected':''}>Light</option></select></div></div><button class="btn" type="submit">Save settings</button></form></section><section class="card" style="margin-top:12px"><h3>Backup & restore</h3><p class="small">Your records stay in this browser unless you export them. Clearing browser data can erase them.</p><div class="actions"><button class="btn" onclick="exportBackup()">Download JSON backup</button><button class="btn secondary" onclick="exportCSV()">Export CSV files</button><label class="btn secondary" style="cursor:pointer;color:var(--fg)">Restore JSON <input type="file" accept=".json,application/json" style="display:none" onchange="restoreBackup(event)"></label></div><div class="notice">Restore replaces all current records. Export a backup first. Files opened through Android content:// may not retain storage reliably; hosting the app at a stable HTTPS URL is preferable.</div></section><section class="card" style="margin-top:12px"><h3>Privacy & reset</h3><button class="btn danger" onclick="resetAll()">Delete all local data</button><p class="hint">No account, server sync, AI uploads or Samsung Health integration. A standalone HTML file cannot r    const raw=String(f.get(k)||'').trim();if(!raw)continue;

`${v4SettingInput('interval','Injection interval (days)','number',s.interval||7,'min="1" max="30" step="1"')}<p class="v4-quiet">Schedule is informational and not dosing advice.</p>`)}${v4Detail('Appearance & reminders',`${v4SettingSelect('theme','Theme',[['dark','Dark'],['light','Light'],['system','System']],s.theme||'dark')}${v4SettingSelect('v4Reminder','Show missing-log reminder',[['false','Off'],['true','On']],String(!!s.v4Reminder))}<p class="v4-quiet">Reminders display only when VitaPath is open. They do not schedule Android notifications.</p>`)}${v4Detail('Data & reports',`<div class="v4-inline-actions"><button class="btn" onclick="exportBackup()">Download JSON backup</button><button class="btn secondary" onclick="exportCSV()">Export CSV</button><label class="btn secondary" style="cursor:pointer">Restore JSON<input type="file" accept=".json,application/json" style="display:none" onchange="restoreBackup(event)"></label><button class="btn secondary" onclick="recoverPrevious()">Recover snapshot</button><button class="btn secondary" onclick="v4OpenReport()">PDF report</button></div><p class="v4-quiet">${esc(mirrorStatus)}. Local storage and IndexedDB are both on this device. Keep an external JSON backup.</p><button class="btn danger" onclick="resetAll()">Erase local records</button>`)}<p class="v4-status">VitaPath 4.0 · Local-only records · ${esc(mirrorStatus)}</p>`}
function v4AutoSetting(el){const name=el.name,raw=el.value;const nums={age:[18,120],height:[100,250],target:[20,500],calories:[500,10000],water:[0,10000],interval:[1,30],v4StepBaseline:[0,10000],v4KcalPerStep:[.01,.09],activityFactor:[1.2,1.725]};if(nums[name]){if(raw===''){if(['height','target','calories'].includes(name)){data.settings[name]=0;commit();return}return}const n=Number(raw),[lo,hi]=nums[name];if(!Number.isFinite(n)||n<lo||n>hi||(name==='age'&&!Number.isInteger(n))){alert('Please enter a valid '+name+' value.');el.focus();return}data.settings[name]=n}else if(['calorieTargetEnabled','v4Reminder'].includes(name))data.settings[name]=raw==='true';else if(name==='theme'||name==='sex'||name==='v4EnergyMode')data.settings[name]=raw;else return;commit()}
function v4OpenReport(){const a=reportStart||addDays(today(),-90),b=reportEnd||today();document.getElementById('modal').innerHTML=`<div class="modalback" onclick="if(event.target===this)closeModal()"><div class="modal" role="dialog" aria-modal="true"><div class="row"><h2>Health report</h2><button class="btn secondary" onclick="closeModal()">✕</button></div><p class="v4-quiet">Choose a date range. The browser's print dialog can save the report as a PDF.</p><div class="fields"><div class="field"><label>From</label><input id="v4ReportFrom" type="date" value="${esc(a)}" max="${today()}"></div><div class="field"><label>To</label><input id="v4ReportTo" type="date" value="${esc(b)}" max="${today()}"></div></div><button class="btn" onclick="v4GenerateReport()">Generate PDF report</button></div></div>`}
function v4GenerateReport(){const a=document.getElementById('v4ReportFrom').value,b=document.getElementById('v4ReportTo').value;if(!v4IsDate(a)||!v4IsDate(b)||a>b||b>today()){alert('Choose a valid date range.');return}reportStart=a;reportEnd=b;closeModal();exportHealthPDF()}
const v4OldOpenForm=openForm;
openForm=function(kind,id=null,preset={}){v4OldOpenForm(kind,id,preset);const form=document.getElementById('entryform');if(!form)return;const k=({food:'meals',weight:'weights'}[kind]||kind);if(k==='meals'){const v=id?data.meals.find(x=>x.id===id):preset;const category=v?.category||v?.mealType||'Uncategorised';const box=document.createElement('div');box.className='field';box.innerHTML=`<label for="v4MealCategory">Meal category</label><select name="category" id="v4MealCategory">${[...v4MealTypes,'Uncategorised'].map(t=>`<option ${t===category?'selected':''}>${t}</option>`).join('')}</select>`;form.querySelector('.fields')?.before(box)}if(k==='injections'){const box=document.createElement('div');box.className='field';box.innerHTML='<label class="v4-check"><input type="checkbox" name="missed" '+(id&&data.injections.find(x=>x.id===id)?.missed?'checked':'')+'> Missed scheduled injection (record only)</label>';form.querySelector('.actions')?.before(box)}};
const v4OldSaveEntry=saveEntry;
saveEntry=function(e,kind,id){const k=({food:'meals',weight:'weights'}[kind]||kind);const f=new FormData(e.target);const date=f.get('date');if(!v4IsDate(date)||date>today()){e.preventDefault();alert('Enter a valid date.');return}const existingIds=new Set(v4Array(k).map(x=>x.id));v4OldSaveEntry(e,kind,id);const list=v4Array(k),record=id?list.find(x=>x.id===id):list.find(x=>!existingIds.has(x.id));if(record&&k==='meals'){record.category=f.get('category')||'Uncategorised';commit()}if(record&&k==='injections'){record.missed=f.has('missed');if(record.missed){record.dose='Missed';record.site=''}commit()}};
const v4OriginalRender=render;
render=function(){if(data.settings.theme==='system'){document.body.classList.toggle('light',matchMedia('(prefers-color-scheme:light)').matches)}v4OriginalRender();if(data.settings.theme==='system')document.body.classList.toggle('light',matchMedia('(prefers-color-scheme:light)').matches);if(tab==='dashboard'&&data.settings.v4Reminder&&v4DayCheck().filter(x=>x[1]).length===0){const view=document.getElementById('view');view.insertAdjacentHTML('afterbegin','<div class="notice">Nothing logged today. Use Daily check-in when ready.</div>')}};
dashboard=v4Dashboard;injections=v4Injections;weight=v4Weight;food=v4Food;activity=v4Activity;labs=v4Labs;insights=v4Insights;settings=v4Settings;
if(!data.settings.v4EnergyMode)data.settings.v4EnergyMode='off';
if(data.settings.v4StepBaseline===undefined)data.settings.v4StepBaseline=2000;
if(data.settings.v4KcalPerStep===undefined)data.settings.v4KcalPerStep=.04;


/* Premium navigation and mobile form usability */
let premiumMoreOpen=false;
function premiumNavigate(target){premiumMoreOpen=false;document.activeElement?.blur?.();go(target)}
function premiumMore(){premiumMoreOpen=!premiumMoreOpen;premiumRenderNav();if(premiumMoreOpen)document.getElementById('premiumMorePanel')?.focus()}
function premiumRenderNav(){
 const el=document.getElementById('premiumBottom');if(!el)return;
 const active=tab;
 const opts=[['dashboard','⌂','Home'],['food','▤','Log'],['insights','▥','Progress'],['more','•••','More']];
 el.innerHTML=opts.map(([id,icon,label])=>'<button type="button" class="'+((id===active||(id==='more'&&['injections','weight','activity','labs','settings'].includes(active)))?'active':'')+'" onclick="'+(id==='more'?'premiumMore()':"premiumNavigate('"+id+"')")+'"><span class="nav-icon">'+icon+'</span><span>'+label+'</span></button>').join('');
 let panel=document.getElementById('premiumMorePanel');
 if(!panel){panel=document.createElement('div');panel.id='premiumMorePanel';panel.className='premium-more-panel';document.body.append(panel)}
 panel.hidden=!premiumMoreOpen;
 panel.innerHTML=[['weight','⚖ Weight'],['injections','💉 Injections'],['activity','↗ Activity'],['labs','⚗ Blood results'],['settings','⚙ Settings']].map(([id,label])=>'<button type="button" onclick="premiumNavigate(\''+id+'\')">'+label+'</button>').join('');
}
const premiumStyle=document.createElement('style');premiumStyle.textContent='.premium-more-panel{position:fixed;z-index:26;right:12px;bottom:calc(82px + env(safe-area-inset-bottom));width:min(280px,calc(100vw - 24px));background:#102630;border:1px solid #34535b;border-radius:19px;padding:10px;box-shadow:0 14px 50px #000a}.premium-more-panel[hidden]{display:none}.premium-more-panel button{display:block;width:100%;text-align:left;border:0;border-radius:11px;background:none;color:#e5f7f3;padding:14px;font:inherit}.premium-more-panel button:active{background:#1b4146}body.light .premium-more-panel{background:white}body.light .premium-more-panel button{color:#17303b}';document.head.append(premiumStyle);
const premiumOriginalRender=render;
render=function(){premiumOriginalRender();premiumRenderNav()};
function premiumDismissKeyboard(){const el=document.activeElement;if(el&&/^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName))el.blur()}
document.addEventListener('submit',e=>{if(e.target.closest('#modal'))premiumDismissKeyboard()},true);
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches('input:not([type="submit"]):not([type="button"]),select')&&e.target.closest('#modal')){if(e.target.type!=='date'&&e.target.type!=='checkbox'){e.preventDefault();premiumDismissKeyboard()}}});
let premiumDay=today();
function premiumRefreshDay(){const now=today();if(now!==premiumDay){premiumDay=now;premiumMoreOpen=false;closeModal();render()}}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)premiumRefreshDay()});
window.addEventListener('focus',premiumRefreshDay);
setInterval(()=>{if(!document.hidden)premiumRefreshDay()},60000);

render();
</script></body></html>
